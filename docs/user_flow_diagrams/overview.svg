<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 770" role="group" aria-label="Sơ đồ Tổng quan" class="flow-svg"><title>User flow — Tổng quan</title><desc>Mở tổng quan → Đọc trạng thái dữ liệu → Chọn việc cần làm → Quay lại cập nhật. Chọn một khối để xem chi tiết.</desc><defs><marker id="arrow-overview" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#69778d"/></marker></defs><style>.flow-svg{font-family:'Segoe UI',Arial,sans-serif}.edge path{fill:none;stroke:#69778d;stroke-width:1.7;stroke-linejoin:round}.edge.retry path{stroke-dasharray:5 4}.edge.optional path{stroke-dasharray:2 5}.edge-label rect{fill:#fff;opacity:.97}.edge-label text{font-size:11px;fill:#475569}.node{cursor:pointer;outline:none}.node .box{fill:#f5f3ff;stroke:#8b76bd;stroke-width:1.4}.node.extension .box{fill:#f8fafc;stroke:#9ca9ba;stroke-dasharray:5 3}.node.decision .box{fill:#fff8e7;stroke:#b58b30}.node.error .box{fill:#fff3ef;stroke:#c78570}.node.result .box{fill:#edf9f5;stroke:#478b77}.node.destination .box{fill:#eef4ff;stroke:#7792bd}.node-kind{font-size:10.5px;fill:#596579}.node-title{font-size:16px;font-weight:650;fill:#1e293b}.node-caption{font-size:12px;fill:#4d5b70}.node:hover .box{stroke:#594090;stroke-width:2.5}.node:focus .box,.node[aria-pressed=true] .box{stroke:#593699;stroke-width:3.5}.node[aria-pressed=true] .node-title{fill:#50317f}</style><rect width="1060" height="770" fill="white"/><g class="edge normal"><path d="M530,130 L530,190" marker-end="url(#arrow-overview)"/></g><g class="edge normal"><path d="M670,235 L750,235" marker-end="url(#arrow-overview)"/><g class="edge-label"><rect x="693.8" y="214" width="32.4" height="18" rx="3"/><text text-anchor="middle"><tspan x="710" y="228">Chưa</tspan></text></g></g><g class="edge normal"><path d="M530,280 L530,340" marker-end="url(#arrow-overview)"/><g class="edge-label"><rect x="538" y="295" width="20.2" height="18" rx="3"/><text text-anchor="start"><tspan x="542" y="309">Có</tspan></text></g></g><g class="edge normal"><path d="M390,385 L310,385" marker-end="url(#arrow-overview)"/><g class="edge-label"><rect x="321.6" y="364" width="56.8" height="18" rx="3"/><text text-anchor="middle"><tspan x="350" y="378">Tiếp tục</tspan></text></g></g><g class="edge normal"><path d="M670,385 L750,385" marker-end="url(#arrow-overview)"/><g class="edge-label"><rect x="675.5" y="364" width="69" height="18" rx="3"/><text text-anchor="middle"><tspan x="710" y="378">Luyện / ôn</tspan></text></g></g><g class="edge normal"><path d="M530,430 L530,490" marker-end="url(#arrow-overview)"/><g class="edge-label"><rect x="538" y="445" width="50.699999999999996" height="18" rx="3"/><text text-anchor="start"><tspan x="542" y="459">Xem lại</tspan></text></g></g><g class="edge normal"><path d="M390,535 L310,535" marker-end="url(#arrow-overview)"/><g class="edge-label"><rect x="321.6" y="501" width="56.8" height="31" rx="3"/><text text-anchor="middle"><tspan x="350" y="515">Xem theo</tspan><tspan x="350" y="528">ngày</tspan></text></g></g><g class="edge normal"><path d="M530,580 L530,640" marker-end="url(#arrow-overview)"/><g class="edge-label"><rect x="538" y="595" width="87.3" height="18" rx="3"/><text text-anchor="start"><tspan x="542" y="609">Đóng chi tiết</tspan></text></g></g><g class="edge normal"><path d="M170,580 L170,685 L390,685" marker-end="url(#arrow-overview)"/><g class="edge-label"><rect x="178" y="617.5" width="50.699999999999996" height="18" rx="3"/><text text-anchor="start"><tspan x="182" y="631.5">Trở lại</tspan></text></g></g><g class="node step" data-node="open" tabindex="0" role="button" aria-label="Mở trang Tổng quan: Việc hôm nay · tiến độ · lịch sử" aria-pressed="false"><rect class="box" x="390" y="40" width="280" height="90" rx="10"/><text class="node-kind" x="410" y="61">Bước thực hiện</text><text class="node-title" x="410" y="87">Mở trang Tổng quan</text><text class="node-caption" x="410" y="110">Việc hôm nay · tiến độ · lịch sử</text></g><g class="node decision" data-node="has" tabindex="0" role="button" aria-label="Đã có hoạt động học?: Phân biệt dữ liệu thật và trang trống" aria-pressed="false"><path class="box" d="M408,190 H652 L670,235 L652,280 H408 L390,235 Z"/><text class="node-kind" x="410" y="211">Điều kiện / lựa chọn</text><text class="node-title" x="410" y="237">Đã có hoạt động học?</text><text class="node-caption" x="410" y="260">Phân biệt dữ liệu thật và trang trống</text></g><g class="node step" data-node="empty" tabindex="0" role="button" aria-label="Chưa có hoạt động: Chọn cách bắt đầu luyện" aria-pressed="false"><rect class="box" x="750" y="190" width="280" height="90" rx="10"/><text class="node-kind" x="770" y="211">Bước thực hiện</text><text class="node-title" x="770" y="237">Chưa có hoạt động</text><text class="node-caption" x="770" y="260">Chọn cách bắt đầu luyện</text></g><g class="node step" data-node="choose" tabindex="0" role="button" aria-label="Chọn việc muốn làm: Tiếp tục · luyện · ôn · xem lại" aria-pressed="false"><rect class="box" x="390" y="340" width="280" height="90" rx="10"/><text class="node-kind" x="410" y="361">Bước thực hiện</text><text class="node-title" x="410" y="387">Chọn việc muốn làm</text><text class="node-caption" x="410" y="410">Tiếp tục · luyện · ôn · xem lại</text></g><g class="node destination" data-node="resume" tabindex="0" role="button" aria-label="Tiếp tục bài / phiên dở: Mở đúng câu, giữ bài đã lưu" aria-pressed="false"><rect class="box" x="30" y="340" width="280" height="90" rx="10"/><text class="node-kind" x="50" y="361">Chuyển trang</text><text class="node-title" x="50" y="387">Tiếp tục bài / phiên dở</text><text class="node-caption" x="50" y="410">Mở đúng câu, giữ bài đã lưu</text></g><g class="node destination" data-node="learn" tabindex="0" role="button" aria-label="Luyện mới hoặc ôn tập: Chọn câu · tạo phiên · mở lộ trình" aria-pressed="false"><rect class="box" x="750" y="340" width="280" height="90" rx="10"/><text class="node-kind" x="770" y="361">Chuyển trang</text><text class="node-title" x="770" y="387">Luyện mới hoặc ôn tập</text><text class="node-caption" x="770" y="410">Chọn câu · tạo phiên · mở lộ trình</text></g><g class="node step" data-node="history" tabindex="0" role="button" aria-label="Chọn bài trong lịch sử: Lọc thời gian · chủ đề · trạng thái" aria-pressed="false"><rect class="box" x="390" y="490" width="280" height="90" rx="10"/><text class="node-kind" x="410" y="511">Bước thực hiện</text><text class="node-title" x="410" y="537">Chọn bài trong lịch sử</text><text class="node-caption" x="410" y="560">Lọc thời gian · chủ đề · trạng thái</text></g><g class="node extension" data-node="calendar" tabindex="0" role="button" aria-label="Xem ngày / điểm danh: Chọn ngày; xác nhận khi đã lưu" aria-pressed="false"><rect class="box" x="30" y="490" width="280" height="90" rx="10"/><text class="node-kind" x="50" y="511">Thiết kế mở rộng</text><text class="node-title" x="50" y="537">Xem ngày / điểm danh</text><text class="node-caption" x="50" y="560">Chọn ngày; xác nhận khi đã lưu</text></g><g class="node result" data-node="return" tabindex="0" role="button" aria-label="Quay lại Tổng quan: Cập nhật hoạt động đã được lưu" aria-pressed="false"><rect class="box" x="390" y="640" width="280" height="90" rx="10"/><text class="node-kind" x="410" y="661">Kết quả</text><text class="node-title" x="410" y="687">Quay lại Tổng quan</text><text class="node-caption" x="410" y="710">Cập nhật hoạt động đã được lưu</text></g></svg>