<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 770" role="group" aria-label="Sơ đồ Bài kiểm tra đầu vào" class="flow-svg"><title>User flow — Bài kiểm tra đầu vào</title><desc>Xác nhận mục tiêu → Làm bài → Rà soát → Lưu và đánh giá → Kết quả nền. Chọn một khối để xem chi tiết.</desc><defs><marker id="arrow-assessment" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#69778d"/></marker></defs><style>.flow-svg{font-family:'Segoe UI',Arial,sans-serif}.edge path{fill:none;stroke:#69778d;stroke-width:1.7;stroke-linejoin:round}.edge.retry path{stroke-dasharray:5 4}.edge.optional path{stroke-dasharray:2 5}.edge-label rect{fill:#fff;opacity:.97}.edge-label text{font-size:11px;fill:#475569}.node{cursor:pointer;outline:none}.node .box{fill:#f5f3ff;stroke:#8b76bd;stroke-width:1.4}.node.extension .box{fill:#f8fafc;stroke:#9ca9ba;stroke-dasharray:5 3}.node.decision .box{fill:#fff8e7;stroke:#b58b30}.node.error .box{fill:#fff3ef;stroke:#c78570}.node.result .box{fill:#edf9f5;stroke:#478b77}.node.destination .box{fill:#eef4ff;stroke:#7792bd}.node-kind{font-size:10.5px;fill:#596579}.node-title{font-size:16px;font-weight:650;fill:#1e293b}.node-caption{font-size:12px;fill:#4d5b70}.node:hover .box{stroke:#594090;stroke-width:2.5}.node:focus .box,.node[aria-pressed=true] .box{stroke:#593699;stroke-width:3.5}.node[aria-pressed=true] .node-title{fill:#50317f}</style><rect width="1060" height="770" fill="white"/><g class="edge normal"><path d="M530,130 L530,190" marker-end="url(#arrow-assessment)"/><g class="edge-label"><rect x="538" y="145" width="75.1" height="18" rx="3"/><text text-anchor="start"><tspan x="542" y="159">Đã xác nhận</tspan></text></g></g><g class="edge normal"><path d="M390,235 L310,235" marker-end="url(#arrow-assessment)"/><g class="edge-label"><rect x="321.6" y="214" width="56.8" height="18" rx="3"/><text text-anchor="middle"><tspan x="350" y="228">Tạm dừng</tspan></text></g></g><g class="edge normal"><path d="M530,280 L530,340" marker-end="url(#arrow-assessment)"/><g class="edge-label"><rect x="538" y="295" width="75.1" height="18" rx="3"/><text text-anchor="start"><tspan x="542" y="309">Rà soát nộp</tspan></text></g></g><g class="edge normal"><path d="M670,385 L750,385" marker-end="url(#arrow-assessment)"/><g class="edge-label"><rect x="684.65" y="364" width="50.699999999999996" height="18" rx="3"/><text text-anchor="middle"><tspan x="710" y="378">Chưa đủ</tspan></text></g></g><g class="edge retry"><path d="M890,340 L890,235 L670,235" marker-end="url(#arrow-assessment)"/><g class="edge-label"><rect x="898" y="272.5" width="56.8" height="18" rx="3"/><text text-anchor="start"><tspan x="902" y="286.5">Làm tiếp</tspan></text></g></g><g class="edge normal"><path d="M530,430 L530,490" marker-end="url(#arrow-assessment)"/><g class="edge-label"><rect x="538" y="445" width="105.6" height="18" rx="3"/><text text-anchor="start"><tspan x="542" y="459">Đủ; xác nhận nộp</tspan></text></g></g><g class="edge normal"><path d="M890,430 L890,465 L530,465 L530,490" marker-end="url(#arrow-assessment)"/><g class="edge-label"><rect x="898" y="432.5" width="117.8" height="18" rx="3"/><text text-anchor="start"><tspan x="902" y="446.5">Xác nhận nộp thiếu</tspan></text></g></g><g class="edge normal"><path d="M670,535 L750,535" marker-end="url(#arrow-assessment)"/><g class="edge-label"><rect x="687.7" y="514" width="44.599999999999994" height="18" rx="3"/><text text-anchor="middle"><tspan x="710" y="528">Có lỗi</tspan></text></g></g><g class="edge normal"><path d="M530,580 L530,640" marker-end="url(#arrow-assessment)"/><g class="edge-label"><rect x="538" y="595" width="87.3" height="18" rx="3"/><text text-anchor="start"><tspan x="542" y="609">Đã có kết quả</tspan></text></g></g><g class="edge normal"><path d="M390,685 L310,685" marker-end="url(#arrow-assessment)"/><g class="edge-label"><rect x="318.55" y="664" width="62.9" height="18" rx="3"/><text text-anchor="middle"><tspan x="350" y="678">Đủ căn cứ</tspan></text></g></g><g class="edge normal"><path d="M670,685 L750,685" marker-end="url(#arrow-assessment)"/><g class="edge-label"><rect x="684.65" y="664" width="50.699999999999996" height="18" rx="3"/><text text-anchor="middle"><tspan x="710" y="678">Chưa đủ</tspan></text></g></g><g class="node extension" data-node="intro" tabindex="0" role="button" aria-label="Xác nhận mục tiêu kiểm tra: Vai trò · cấp độ · phạm vi đánh giá" aria-pressed="false"><rect class="box" x="390" y="40" width="280" height="90" rx="10"/><text class="node-kind" x="410" y="61">Thiết kế mở rộng</text><text class="node-title" x="410" y="87">Xác nhận mục tiêu kiểm tra</text><text class="node-caption" x="410" y="110">Vai trò · cấp độ · phạm vi đánh giá</text></g><g class="node extension" data-node="write" tabindex="0" role="button" aria-label="Làm bài kiểm tra ba phần: Trắc nghiệm · tự luận · tình huống" aria-pressed="false"><rect class="box" x="390" y="190" width="280" height="90" rx="10"/><text class="node-kind" x="410" y="211">Thiết kế mở rộng</text><text class="node-title" x="410" y="237">Làm bài kiểm tra ba phần</text><text class="node-caption" x="410" y="260">Trắc nghiệm · tự luận · tình huống</text></g><g class="node step" data-node="resume" tabindex="0" role="button" aria-label="Lưu và thoát / tiếp tục: Mở lại đúng lượt và đúng câu" aria-pressed="false"><rect class="box" x="30" y="190" width="280" height="90" rx="10"/><text class="node-kind" x="50" y="211">Bước thực hiện</text><text class="node-title" x="50" y="237">Lưu và thoát / tiếp tục</text><text class="node-caption" x="50" y="260">Mở lại đúng lượt và đúng câu</text></g><g class="node decision" data-node="review" tabindex="0" role="button" aria-label="Rà soát: đã trả lời đủ?: Xem danh sách câu còn trống" aria-pressed="false"><path class="box" d="M408,340 H652 L670,385 L652,430 H408 L390,385 Z"/><text class="node-kind" x="410" y="361">Điều kiện / lựa chọn</text><text class="node-title" x="410" y="387">Rà soát: đã trả lời đủ?</text><text class="node-caption" x="410" y="410">Xem danh sách câu còn trống</text></g><g class="node decision" data-node="missing" tabindex="0" role="button" aria-label="Còn câu chưa trả lời: Làm tiếp hoặc xác nhận nộp thiếu" aria-pressed="false"><path class="box" d="M768,340 H1012 L1030,385 L1012,430 H768 L750,385 Z"/><text class="node-kind" x="770" y="361">Điều kiện / lựa chọn</text><text class="node-title" x="770" y="387">Còn câu chưa trả lời</text><text class="node-caption" x="770" y="410">Làm tiếp hoặc xác nhận nộp thiếu</text></g><g class="node extension" data-node="submit" tabindex="0" role="button" aria-label="Nộp và đánh giá bài đã lưu: Trích bằng chứng → đối chiếu rubric" aria-pressed="false"><rect class="box" x="390" y="490" width="280" height="90" rx="10"/><text class="node-kind" x="410" y="511">Thiết kế mở rộng</text><text class="node-title" x="410" y="537">Nộp và đánh giá bài đã lưu</text><text class="node-caption" x="410" y="560">Trích bằng chứng → đối chiếu rubric</text></g><g class="node error" data-node="failure" tabindex="0" role="button" aria-label="Lưu / AI gặp lỗi: Giữ bài, đối soát và thử lại" aria-pressed="false"><rect class="box" x="750" y="490" width="280" height="90" rx="10"/><text class="node-kind" x="770" y="511">Nhánh lỗi / ngoại lệ</text><text class="node-title" x="770" y="537">Lưu / AI gặp lỗi</text><text class="node-caption" x="770" y="560">Giữ bài, đối soát và thử lại</text></g><g class="node result" data-node="result" tabindex="0" role="button" aria-label="Xem kết quả đầu vào: Kỹ năng đã kiểm tra · phần còn thiếu" aria-pressed="false"><rect class="box" x="390" y="640" width="280" height="90" rx="10"/><text class="node-kind" x="410" y="661">Kết quả</text><text class="node-title" x="410" y="687">Xem kết quả đầu vào</text><text class="node-caption" x="410" y="710">Kỹ năng đã kiểm tra · phần còn thiếu</text></g><g class="node destination" data-node="roadmap" tabindex="0" role="button" aria-label="Mở lộ trình cá nhân hóa: Chỉ đề xuất phần có căn cứ" aria-pressed="false"><rect class="box" x="30" y="640" width="280" height="90" rx="10"/><text class="node-kind" x="50" y="661">Chuyển trang</text><text class="node-title" x="50" y="687">Mở lộ trình cá nhân hóa</text><text class="node-caption" x="50" y="710">Chỉ đề xuất phần có căn cứ</text></g><g class="node extension" data-node="add" tabindex="0" role="button" aria-label="Bổ sung phần còn thiếu: Làm thêm / thử lại bài lỗi" aria-pressed="false"><rect class="box" x="750" y="640" width="280" height="90" rx="10"/><text class="node-kind" x="770" y="661">Thiết kế mở rộng</text><text class="node-title" x="770" y="687">Bổ sung phần còn thiếu</text><text class="node-caption" x="770" y="710">Làm thêm / thử lại bài lỗi</text></g></svg>