<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 770" role="group" aria-label="Sơ đồ Đăng nhập" class="flow-svg"><title>User flow — Đăng nhập</title><desc>Chọn Google / email / khách → Xác thực hoặc xác minh → Trở đúng trang đích. Chọn một khối để xem chi tiết.</desc><defs><marker id="arrow-login" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#69778d"/></marker></defs><style>.flow-svg{font-family:'Segoe UI',Arial,sans-serif}.edge path{fill:none;stroke:#69778d;stroke-width:1.7;stroke-linejoin:round}.edge.retry path{stroke-dasharray:5 4}.edge.optional path{stroke-dasharray:2 5}.edge-label rect{fill:#fff;opacity:.97}.edge-label text{font-size:11px;fill:#475569}.node{cursor:pointer;outline:none}.node .box{fill:#f5f3ff;stroke:#8b76bd;stroke-width:1.4}.node.extension .box{fill:#f8fafc;stroke:#9ca9ba;stroke-dasharray:5 3}.node.decision .box{fill:#fff8e7;stroke:#b58b30}.node.error .box{fill:#fff3ef;stroke:#c78570}.node.result .box{fill:#edf9f5;stroke:#478b77}.node.destination .box{fill:#eef4ff;stroke:#7792bd}.node-kind{font-size:10.5px;fill:#596579}.node-title{font-size:16px;font-weight:650;fill:#1e293b}.node-caption{font-size:12px;fill:#4d5b70}.node:hover .box{stroke:#594090;stroke-width:2.5}.node:focus .box,.node[aria-pressed=true] .box{stroke:#593699;stroke-width:3.5}.node[aria-pressed=true] .node-title{fill:#50317f}</style><rect width="1060" height="770" fill="white"/><g class="edge normal"><path d="M530,130 L530,190" marker-end="url(#arrow-login)"/></g><g class="edge normal"><path d="M670,235 L750,235" marker-end="url(#arrow-login)"/><g class="edge-label"><rect x="672.45" y="201" width="75.1" height="31" rx="3"/><text text-anchor="middle"><tspan x="710" y="215">Không thành</tspan><tspan x="710" y="228">công</tspan></text></g></g><g class="edge retry"><path d="M890,190 L890,165 L670,165 L670,190" marker-end="url(#arrow-login)"/><g class="edge-label"><rect x="898" y="162.5" width="50.699999999999996" height="18" rx="3"/><text text-anchor="start"><tspan x="902" y="176.5">Thử lại</tspan></text></g></g><g class="edge normal"><path d="M530,280 L530,340" marker-end="url(#arrow-login)"/><g class="edge-label"><rect x="538" y="295" width="75.1" height="18" rx="3"/><text text-anchor="start"><tspan x="542" y="309">Đã xác thực</tspan></text></g></g><g class="edge normal"><path d="M670,385 L750,385" marker-end="url(#arrow-login)"/><g class="edge-label"><rect x="684.65" y="364" width="50.699999999999996" height="18" rx="3"/><text text-anchor="middle"><tspan x="710" y="378">Chưa có</tspan></text></g></g><g class="edge normal"><path d="M530,430 L530,490" marker-end="url(#arrow-login)"/><g class="edge-label"><rect x="538" y="445" width="38.5" height="18" rx="3"/><text text-anchor="start"><tspan x="542" y="459">Đã có</tspan></text></g></g><g class="edge normal"><path d="M890,430 L890,460 L530,460 L530,490" marker-end="url(#arrow-login)"/><g class="edge-label"><rect x="898" y="430" width="81.19999999999999" height="18" rx="3"/><text text-anchor="start"><tspan x="902" y="444">Đã lưu hồ sơ</tspan></text></g></g><g class="edge retry"><path d="M170,490 L170,85 L390,85" marker-end="url(#arrow-login)"/><g class="edge-label"><rect x="178" y="272.5" width="81.19999999999999" height="18" rx="3"/><text text-anchor="start"><tspan x="182" y="286.5">Xác thực lại</tspan></text></g></g><g class="edge optional"><path d="M530,580 L530,640" marker-end="url(#arrow-login)"/><g class="edge-label"><rect x="538" y="595" width="154.39999999999998" height="18" rx="3"/><text text-anchor="start"><tspan x="542" y="609">Chỉ khi có lịch sử khách</tspan></text></g></g><g class="edge normal"><path d="M390,85 L340,85 L340,235 L310,235" marker-end="url(#arrow-login)"/><g class="edge-label"><rect x="330.5" y="64" width="69" height="18" rx="3"/><text text-anchor="middle"><tspan x="365" y="78">Chọn email</tspan></text></g></g><g class="edge normal"><path d="M310,235 L350,235 L350,385 L390,385" marker-end="url(#arrow-login)"/><g class="edge-label"><rect x="295.5" y="214" width="69" height="18" rx="3"/><text text-anchor="middle"><tspan x="330" y="228">Thành công</tspan></text></g></g><g class="edge normal"><path d="M170,280 L170,340" marker-end="url(#arrow-login)"/><g class="edge-label"><rect x="178" y="295" width="87.3" height="18" rx="3"/><text text-anchor="start"><tspan x="182" y="309">Quên mật khẩu</tspan></text></g></g><g class="edge normal"><path d="M670,85 L750,85" marker-end="url(#arrow-login)"/><g class="edge-label"><rect x="684.65" y="51" width="50.699999999999996" height="31" rx="3"/><text text-anchor="middle"><tspan x="710" y="65">Tạo tài</tspan><tspan x="710" y="78">khoản</tspan></text></g></g><g class="edge retry"><path d="M890,130 L890,150 L530,150 L530,190" marker-end="url(#arrow-login)"/><g class="edge-label"><rect x="898" y="125" width="81.19999999999999" height="18" rx="3"/><text text-anchor="start"><tspan x="902" y="139">Sau xác minh</tspan></text></g></g><g class="node step" data-node="open" tabindex="0" role="button" aria-label="Mở trang Đăng nhập: Ghi nhớ trang người dùng đang đến" aria-pressed="false"><rect class="box" x="390" y="40" width="280" height="90" rx="10"/><text class="node-kind" x="410" y="61">Bước thực hiện</text><text class="node-title" x="410" y="87">Mở trang Đăng nhập</text><text class="node-caption" x="410" y="110">Ghi nhớ trang người dùng đang đến</text></g><g class="node step" data-node="google" tabindex="0" role="button" aria-label="Tiếp tục với Google: Chọn tài khoản và chấp thuận" aria-pressed="false"><rect class="box" x="390" y="190" width="280" height="90" rx="10"/><text class="node-kind" x="410" y="211">Bước thực hiện</text><text class="node-title" x="410" y="237">Tiếp tục với Google</text><text class="node-caption" x="410" y="260">Chọn tài khoản và chấp thuận</text></g><g class="node error" data-node="cancel" tabindex="0" role="button" aria-label="Hủy / từ chối / lỗi kết nối: Giữ đích đến và dữ liệu đang làm" aria-pressed="false"><rect class="box" x="750" y="190" width="280" height="90" rx="10"/><text class="node-kind" x="770" y="211">Nhánh lỗi / ngoại lệ</text><text class="node-title" x="770" y="237">Hủy / từ chối / lỗi kết nối</text><text class="node-caption" x="770" y="260">Giữ đích đến và dữ liệu đang làm</text></g><g class="node decision" data-node="account" tabindex="0" role="button" aria-label="Tài khoản đã có hồ sơ?: Sau khi xác thực thành công" aria-pressed="false"><path class="box" d="M408,340 H652 L670,385 L652,430 H408 L390,385 Z"/><text class="node-kind" x="410" y="361">Điều kiện / lựa chọn</text><text class="node-title" x="410" y="387">Tài khoản đã có hồ sơ?</text><text class="node-caption" x="410" y="410">Sau khi xác thực thành công</text></g><g class="node step" data-node="profile" tabindex="0" role="button" aria-label="Lần đầu: xác nhận hồ sơ: Tên hiển thị · mục tiêu luyện" aria-pressed="false"><rect class="box" x="750" y="340" width="280" height="90" rx="10"/><text class="node-kind" x="770" y="361">Bước thực hiện</text><text class="node-title" x="770" y="387">Lần đầu: xác nhận hồ sơ</text><text class="node-caption" x="770" y="410">Tên hiển thị · mục tiêu luyện</text></g><g class="node result" data-node="return" tabindex="0" role="button" aria-label="Trở lại đúng trang đích: Khôi phục ngữ cảnh, không tự gửi bài" aria-pressed="false"><rect class="box" x="390" y="490" width="280" height="90" rx="10"/><text class="node-kind" x="410" y="511">Kết quả</text><text class="node-title" x="410" y="537">Trở lại đúng trang đích</text><text class="node-caption" x="410" y="560">Khôi phục ngữ cảnh, không tự gửi bài</text></g><g class="node error" data-node="expired" tabindex="0" role="button" aria-label="Phiên đăng nhập hết hạn: Giữ nháp; yêu cầu xác thực lại" aria-pressed="false"><rect class="box" x="30" y="490" width="280" height="90" rx="10"/><text class="node-kind" x="50" y="511">Nhánh lỗi / ngoại lệ</text><text class="node-title" x="50" y="537">Phiên đăng nhập hết hạn</text><text class="node-caption" x="50" y="560">Giữ nháp; yêu cầu xác thực lại</text></g><g class="node extension" data-node="merge" tabindex="0" role="button" aria-label="Nếu đang có lịch sử khách: Cần chốt chính sách ghép dữ liệu" aria-pressed="false"><rect class="box" x="390" y="640" width="280" height="90" rx="10"/><text class="node-kind" x="410" y="661">Thiết kế mở rộng</text><text class="node-title" x="410" y="687">Nếu đang có lịch sử khách</text><text class="node-caption" x="410" y="710">Cần chốt chính sách ghép dữ liệu</text></g><g class="node step" data-node="email" tabindex="0" role="button" aria-label="Đăng nhập bằng email: Email · mật khẩu · ghi nhớ phiên" aria-pressed="false"><rect class="box" x="30" y="190" width="280" height="90" rx="10"/><text class="node-kind" x="50" y="211">Bước thực hiện</text><text class="node-title" x="50" y="237">Đăng nhập bằng email</text><text class="node-caption" x="50" y="260">Email · mật khẩu · ghi nhớ phiên</text></g><g class="node step" data-node="reset" tabindex="0" role="button" aria-label="Quên mật khẩu: Yêu cầu link → đặt mật khẩu mới" aria-pressed="false"><rect class="box" x="30" y="340" width="280" height="90" rx="10"/><text class="node-kind" x="50" y="361">Bước thực hiện</text><text class="node-title" x="50" y="387">Quên mật khẩu</text><text class="node-caption" x="50" y="410">Yêu cầu link → đặt mật khẩu mới</text></g><g class="node step" data-node="register" tabindex="0" role="button" aria-label="Tạo tài khoản: Thông tin tối thiểu · xác minh email" aria-pressed="false"><rect class="box" x="750" y="40" width="280" height="90" rx="10"/><text class="node-kind" x="770" y="61">Bước thực hiện</text><text class="node-title" x="770" y="87">Tạo tài khoản</text><text class="node-caption" x="770" y="110">Thông tin tối thiểu · xác minh email</text></g></svg>