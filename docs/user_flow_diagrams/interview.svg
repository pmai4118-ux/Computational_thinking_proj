<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 770" role="group" aria-label="Sơ đồ Phiên phỏng vấn" class="flow-svg"><title>User flow — Phiên phỏng vấn</title><desc>Chọn cấu hình → Xác nhận → Trả lời và lưu → Câu tiếp → Tổng kết. Chọn một khối để xem chi tiết.</desc><defs><marker id="arrow-interview" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#69778d"/></marker></defs><style>.flow-svg{font-family:'Segoe UI',Arial,sans-serif}.edge path{fill:none;stroke:#69778d;stroke-width:1.7;stroke-linejoin:round}.edge.retry path{stroke-dasharray:5 4}.edge.optional path{stroke-dasharray:2 5}.edge-label rect{fill:#fff;opacity:.97}.edge-label text{font-size:11px;fill:#475569}.node{cursor:pointer;outline:none}.node .box{fill:#f5f3ff;stroke:#8b76bd;stroke-width:1.4}.node.extension .box{fill:#f8fafc;stroke:#9ca9ba;stroke-dasharray:5 3}.node.decision .box{fill:#fff8e7;stroke:#b58b30}.node.error .box{fill:#fff3ef;stroke:#c78570}.node.result .box{fill:#edf9f5;stroke:#478b77}.node.destination .box{fill:#eef4ff;stroke:#7792bd}.node-kind{font-size:10.5px;fill:#596579}.node-title{font-size:16px;font-weight:650;fill:#1e293b}.node-caption{font-size:12px;fill:#4d5b70}.node:hover .box{stroke:#594090;stroke-width:2.5}.node:focus .box,.node[aria-pressed=true] .box{stroke:#593699;stroke-width:3.5}.node[aria-pressed=true] .node-title{fill:#50317f}</style><rect width="1060" height="770" fill="white"/><g class="edge normal"><path d="M530,130 L530,190" marker-end="url(#arrow-interview)"/><g class="edge-label"><rect x="538" y="145" width="62.9" height="18" rx="3"/><text text-anchor="start"><tspan x="542" y="159">Tạo phiên</tspan></text></g></g><g class="edge normal"><path d="M390,85 L310,85" marker-end="url(#arrow-interview)"/><g class="edge-label"><rect x="312.45" y="64" width="75.1" height="18" rx="3"/><text text-anchor="middle"><tspan x="350" y="78">Có phiên dở</tspan></text></g></g><g class="edge retry"><path d="M170,130 L170,300 L390,300 L390,340" marker-end="url(#arrow-interview)"/><g class="edge-label"><rect x="178" y="200" width="56.8" height="18" rx="3"/><text text-anchor="start"><tspan x="182" y="214">Tiếp tục</tspan></text></g></g><g class="edge normal"><path d="M670,235 L750,235" marker-end="url(#arrow-interview)"/><g class="edge-label"><rect x="672.45" y="214" width="75.1" height="18" rx="3"/><text text-anchor="middle"><tspan x="710" y="228">Chưa hợp lệ</tspan></text></g></g><g class="edge normal"><path d="M530,280 L530,340" marker-end="url(#arrow-interview)"/><g class="edge-label"><rect x="538" y="295" width="75.1" height="18" rx="3"/><text text-anchor="start"><tspan x="542" y="309">Đã xác nhận</tspan></text></g></g><g class="edge normal"><path d="M390,385 L310,385" marker-end="url(#arrow-interview)"/><g class="edge-label"><rect x="318.55" y="364" width="62.9" height="18" rx="3"/><text text-anchor="middle"><tspan x="350" y="378">Rời trang</tspan></text></g></g><g class="edge normal"><path d="M530,430 L530,490" marker-end="url(#arrow-interview)"/><g class="edge-label"><rect x="538" y="445" width="178.79999999999998" height="18" rx="3"/><text text-anchor="start"><tspan x="542" y="459">Đã lưu; phản hồi theo chế độ</tspan></text></g></g><g class="edge normal"><path d="M670,535 L750,535" marker-end="url(#arrow-interview)"/><g class="edge-label"><rect x="699.9" y="514" width="20.2" height="18" rx="3"/><text text-anchor="middle"><tspan x="710" y="528">Có</tspan></text></g></g><g class="edge retry"><path d="M890,490 L890,385 L670,385" marker-end="url(#arrow-interview)"/><g class="edge-label"><rect x="898" y="422.5" width="56.8" height="18" rx="3"/><text text-anchor="start"><tspan x="902" y="436.5">Tiếp tục</tspan></text></g></g><g class="edge normal"><path d="M530,580 L530,640" marker-end="url(#arrow-interview)"/><g class="edge-label"><rect x="538" y="595" width="38.5" height="18" rx="3"/><text text-anchor="start"><tspan x="542" y="609">Không</tspan></text></g></g><g class="edge normal"><path d="M30,385 L10,385 L10,685 L390,685" marker-end="url(#arrow-interview)"/><g class="edge-label"><rect x="-20.599999999999994" y="351" width="81.19999999999999" height="31" rx="3"/><text text-anchor="middle"><tspan x="20" y="365">Xác nhận kết</tspan><tspan x="20" y="378">thúc</tspan></text></g></g><g class="edge normal"><path d="M670,385 L750,385" marker-end="url(#arrow-interview)"/><g class="edge-label"><rect x="681.6" y="351" width="56.8" height="31" rx="3"/><text text-anchor="middle"><tspan x="710" y="365">Đổi cách</tspan><tspan x="710" y="378">nhập</tspan></text></g></g><g class="edge retry"><path d="M890,340 L890,310 L670,310 L670,340" marker-end="url(#arrow-interview)"/><g class="edge-label"><rect x="898" y="310" width="99.5" height="18" rx="3"/><text text-anchor="start"><tspan x="902" y="324">Dùng transcript</tspan></text></g></g><g class="edge normal"><path d="M390,385 L340,385 L340,535 L310,535" marker-end="url(#arrow-interview)"/><g class="edge-label"><rect x="348.8" y="364" width="32.4" height="18" rx="3"/><text text-anchor="middle"><tspan x="365" y="378">Chat</tspan></text></g></g><g class="node step" data-node="config" tabindex="0" role="button" aria-label="Chọn phiên và chế độ: Chủ đề · cấp độ · cách nhận phản hồi" aria-pressed="false"><rect class="box" x="390" y="40" width="280" height="90" rx="10"/><text class="node-kind" x="410" y="61">Bước thực hiện</text><text class="node-title" x="410" y="87">Chọn phiên và chế độ</text><text class="node-caption" x="410" y="110">Chủ đề · cấp độ · cách nhận phản hồi</text></g><g class="node step" data-node="setup" tabindex="0" role="button" aria-label="Làm rõ và xác nhận: Kiểm tra mục tiêu và đủ câu hỏi" aria-pressed="false"><rect class="box" x="390" y="190" width="280" height="90" rx="10"/><text class="node-kind" x="410" y="211">Bước thực hiện</text><text class="node-title" x="410" y="237">Làm rõ và xác nhận</text><text class="node-caption" x="410" y="260">Kiểm tra mục tiêu và đủ câu hỏi</text></g><g class="node error" data-node="missing" tabindex="0" role="button" aria-label="Thiếu thông tin / câu hỏi: Sửa cấu hình hoặc hủy" aria-pressed="false"><rect class="box" x="750" y="190" width="280" height="90" rx="10"/><text class="node-kind" x="770" y="211">Nhánh lỗi / ngoại lệ</text><text class="node-title" x="770" y="237">Thiếu thông tin / câu hỏi</text><text class="node-caption" x="770" y="260">Sửa cấu hình hoặc hủy</text></g><g class="node step" data-node="write" tabindex="0" role="button" aria-label="Trả lời câu hiện tại: Nhập tự luận → gửi → xác nhận lưu" aria-pressed="false"><rect class="box" x="390" y="340" width="280" height="90" rx="10"/><text class="node-kind" x="410" y="361">Bước thực hiện</text><text class="node-title" x="410" y="387">Trả lời câu hiện tại</text><text class="node-caption" x="410" y="410">Nhập tự luận → gửi → xác nhận lưu</text></g><g class="node decision" data-node="exit" tabindex="0" role="button" aria-label="Muốn rời / kết thúc sớm: Hủy rời · lưu và thoát · kết thúc" aria-pressed="false"><path class="box" d="M48,340 H292 L310,385 L292,430 H48 L30,385 Z"/><text class="node-kind" x="50" y="361">Điều kiện / lựa chọn</text><text class="node-title" x="50" y="387">Muốn rời / kết thúc sớm</text><text class="node-caption" x="50" y="410">Hủy rời · lưu và thoát · kết thúc</text></g><g class="node decision" data-node="more" tabindex="0" role="button" aria-label="Còn câu trong phiên?: Kiểm tra tiến độ sau mỗi lần lưu" aria-pressed="false"><path class="box" d="M408,490 H652 L670,535 L652,580 H408 L390,535 Z"/><text class="node-kind" x="410" y="511">Điều kiện / lựa chọn</text><text class="node-title" x="410" y="537">Còn câu trong phiên?</text><text class="node-caption" x="410" y="560">Kiểm tra tiến độ sau mỗi lần lưu</text></g><g class="node step" data-node="next" tabindex="0" role="button" aria-label="Mở câu tiếp theo: Giữ nguyên bài đã nộp" aria-pressed="false"><rect class="box" x="750" y="490" width="280" height="90" rx="10"/><text class="node-kind" x="770" y="511">Bước thực hiện</text><text class="node-title" x="770" y="537">Mở câu tiếp theo</text><text class="node-caption" x="770" y="560">Giữ nguyên bài đã nộp</text></g><g class="node result" data-node="summary" tabindex="0" role="button" aria-label="Xem tổng kết phiên: Đủ / thiếu câu · trạng thái từng bài" aria-pressed="false"><rect class="box" x="390" y="640" width="280" height="90" rx="10"/><text class="node-kind" x="410" y="661">Kết quả</text><text class="node-title" x="410" y="687">Xem tổng kết phiên</text><text class="node-caption" x="410" y="710">Đủ / thiếu câu · trạng thái từng bài</text></g><g class="node step" data-node="resume" tabindex="0" role="button" aria-label="Tiếp tục phiên dở: Mở đúng câu và bản nháp" aria-pressed="false"><rect class="box" x="30" y="40" width="280" height="90" rx="10"/><text class="node-kind" x="50" y="61">Bước thực hiện</text><text class="node-title" x="50" y="87">Tiếp tục phiên dở</text><text class="node-caption" x="50" y="110">Mở đúng câu và bản nháp</text></g><g class="node step" data-node="voice" tabindex="0" role="button" aria-label="Văn bản hoặc ghi âm: Transcript phải được xác nhận" aria-pressed="false"><rect class="box" x="750" y="340" width="280" height="90" rx="10"/><text class="node-kind" x="770" y="361">Bước thực hiện</text><text class="node-title" x="770" y="387">Văn bản hoặc ghi âm</text><text class="node-caption" x="770" y="410">Transcript phải được xác nhận</text></g><g class="node step" data-node="chat" tabindex="0" role="button" aria-label="Gửi tin cho trợ lý: Không phải nút nộp câu trả lời" aria-pressed="false"><rect class="box" x="30" y="490" width="280" height="90" rx="10"/><text class="node-kind" x="50" y="511">Bước thực hiện</text><text class="node-title" x="50" y="537">Gửi tin cho trợ lý</text><text class="node-caption" x="50" y="560">Không phải nút nộp câu trả lời</text></g></svg>