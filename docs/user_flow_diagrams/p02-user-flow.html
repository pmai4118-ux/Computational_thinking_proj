=\"node-caption\" x=\"770\" y=\"710\">Làm thêm / thử lại bài lỗi\u003c/text>\u003c/g>\u003c/svg>","nodes":[{"id":"intro","title":["Xác nhận mục tiêu kiểm tra"],"detail":{"action":"Đọc hướng dẫn, số câu, thời lượng nếu đã cấu hình và tác động của việc kiểm tra lại.","next":"Bắt đầu lượt mới sau xác nhận hoặc tiếp tục lượt đang dở; giữ kết quả cũ."}},{"id":"write","title":["Làm bài kiểm tra ba phần"],"detail":{"action":"Chọn option ở trắc nghiệm; soạn blocks hoặc chèn transcript đã xác nhận ở tự luận/case. Tab/số câu/Câu trước giữ nháp, không nộp.","next":"Lưu & sang câu tiếp chỉ lưu draft; Nộp bài mở rà soát. Không khóa case chỉ vì phần trước chưa xong; chat chỉ thao tác/làm rõ trung tính."}},{"id":"resume","title":["Lưu và thoát / tiếp tục"],"detail":{"action":"Chọn lưu và thoát; chỉ xác nhận lưu sau phản hồi thành công.","next":"Lần sau cho tiếp tục lượt cũ hoặc xác nhận tạo lượt khác, giữ lượt trước."}},{"id":"review","title":["Rà soát: đã trả lời đủ?"],"detail":{"action":"Hiển thị các câu còn thiếu trước nút xác nhận nộp.","next":"Đủ → xác nhận nộp. Thiếu → quay lại làm hoặc xác nhận nộp phần đã có theo chính sách được duyệt."}},{"id":"missing","title":["Còn câu chưa trả lời"],"detail":{"action":"Nêu số câu chưa làm và giới hạn của kết quả nếu nộp lúc này.","next":"Làm tiếp quay về bài; nộp thiếu chỉ tiếp tục khi đã xác nhận.","note":"Người dùng xác nhận nộp thiếu thì lưu snapshot partial; phần chưa làm không tính 0."}},{"id":"submit","title":["Nộp và đánh giá bài đã lưu"],"detail":{"action":"Server đếm lại câu trống và kiểm tra revision; xác nhận full/partial tạo snapshot atomic, khóa sửa mọi response.","next":"Choice so key đã review; tự luận/case diễn giải→xác thực→rubric. Lỗi từng item retry đúng snapshot, không chấm lại tất cả hoặc sửa đáp án."}},{"id":"failure","title":["Lưu / AI gặp lỗi"],"detail":{"action":"Phân biệt chưa lưu được với đã lưu nhưng chưa đánh giá được.","next":"Thử lại đúng bước có giới hạn; giữ các kết quả câu đã có, không chạy lại toàn bộ <script>
  const pages = JSON.parse(document.getElementById('flow-data').textContent);
  const areas = document.getElementById('areas');
  const canvas = document.getElementById('canvas');
  const detail = document.getElementById('detail');
  const buttons = new Map();
  let activePage;

  function selectArea(page) {
    activePage = page;
    for (const [id, button] of buttons) button.setAttribute('aria-pressed', String(id === page.id));
    document.getElementById('area-title').textContent = page.name;
    document.getElementById('summary').textContent = page.summary;
    canvas.innerHTML = page.svg;
    canvas.scrollLeft = 0;
    detail.textContent = 'Chọn một khối để xem thao tác và hướng đi.';
  }

  function selectNode(element) {
    const node = activePage.nodes.find(item => item.id === element.dataset.node);
    if (!node) return;
    for (const item of canvas.querySelectorAll('[data-node]')) {
      item.setAttribute('aria-pressed', String(item === element));
    }
    const title = document.createElement('h3');
    title.textContent = node.title.join(' ');
    detail.replaceChildren(title);
    for (const [label, value] of [['Thao tác', node.detail.action], ['Hướng đi', node.detail.next], ['Lưu ý', node.detail.note]]) {
      if (!value) continue;
      const heading = document.createElement('p');
      heading.className = 'label';
      heading.textContent = label;
      const paragraph = document.createElement('p');
      paragraph.textContent = value;
      detail.append(heading, paragraph);
    }
  }

  for (const page of pages) {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = page.name;
    button.addEventListener('click', () => selectArea(page));
    buttons.set(page.id, button);
    areas.append(button);
  }
  canvas.addEventListener('click', event => {
    const node = event.target.closest('[data-node]');
    if (node) selectNode(node);
  });
  canvas.addEventListener('keydown', event => {
    const node = event.target.closest('[data-node]');
    if (!node || !['Enter', ' '].includes(event.key)) return;
    event.preventDefault();
    selectNode(node);
  });
  document.getElementById('download').addEventListener('click', () => {
    const url = URL.createObjectURL(new Blob([activePage.svg], { type: 'image/svg+xml' }));
    const link = document.createElement('a');
    link.href = url;
    link.download = 'p02-' + activePage.id + '.svg';
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });
  selectArea(pages[0]);
</script>
