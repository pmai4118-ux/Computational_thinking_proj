<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 770" role="group" aria-label="Sơ đồ Lộ trình cá nhân hóa" class="flow-svg"><title>User flow — Lộ trình cá nhân hóa</title><desc>Mở lộ trình → Kiểm tra dữ liệu nền → Chọn mục → Học và kiểm tra → Cập nhật. Chọn một khối để xem chi tiết.</desc><defs><marker id="arrow-roadmap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#69778d"/></marker></defs><style>.flow-svg{font-family:'Segoe UI',Arial,sans-serif}.edge path{fill:none;stroke:#69778d;stroke-width:1.7;stroke-linejoin:round}.edge.retry path{stroke-dasharray:5 4}.edge.optional path{stroke-dasharray:2 5}.edge-label rect{fill:#fff;opacity:.97}.edge-label text{font-size:11px;fill:#475569}.node{cursor:pointer;outline:none}.node .box{fill:#f5f3ff;stroke:#8b76bd;stroke-width:1.4}.node.extension .box{fill:#f8fafc;stroke:#9ca9ba;stroke-dasharray:5 3}.node.decision .box{fill:#fff8e7;stroke:#b58b30}.node.error .box{fill:#fff3ef;stroke:#c78570}.node.result .box{fill:#edf9f5;stroke:#478b77}.node.destination .box{fill:#eef4ff;stroke:#7792bd}.node-kind{font-size:10.5px;fill:#596579}.node-title{font-size:16px;font-weight:650;fill:#1e293b}.node-caption{font-size:12px;fill:#4d5b70}.node:hover .box{stroke:#594090;stroke-width:2.5}.node:focus .box,.node[aria-pressed=true] .box{stroke:#593699;stroke-width:3.5}.node[aria-pressed=true] .node-title{fill:#50317f}</style><rect width="1060" height="770" fill="white"/><g class="edge normal"><path d="M530,130 L530,190" marker-end="url(#arrow-roadmap)"/></g><g class="edge normal"><path d="M670,235 L750,235" marker-end="url(#arrow-roadmap)"/><g class="edge-label"><rect x="693.8" y="214" width="32.4" height="18" rx="3"/><text text-anchor="middle"><tspan x="710" y="228">Chưa</tspan></text></g></g><g class="edge normal"><path d="M530,280 L530,340" marker-end="url(#arrow-roadmap)"/><g class="edge-label"><rect x="538" y="295" width="20.2" height="18" rx="3"/><text text-anchor="start"><tspan x="542" y="309">Có</tspan></text></g></g><g class="edge retry"><path d="M890,280 L890,315 L530,315 L530,340" marker-end="url(#arrow-roadmap)"/><g class="edge-label"><rect x="898" y="282.5" width="117.8" height="18" rx="3"/><text text-anchor="start"><tspan x="902" y="296.5">Có kết quả phù hợp</tspan></text></g></g><g class="edge normal"><path d="M390,385 L310,385" marker-end="url(#arrow-roadmap)"/><g class="edge-label"><rect x="315.5" y="364" width="69" height="18" rx="3"/><text text-anchor="middle"><tspan x="350" y="378">Điều chỉnh</tspan></text></g></g><g class="edge normal"><path d="M530,430 L530,490" marker-end="url(#arrow-roadmap)"/><g class="edge-label"><rect x="538" y="445" width="69" height="18" rx="3"/><text text-anchor="start"><tspan x="542" y="459">Mở mục học</tspan></text></g></g><g class="edge normal"><path d="M670,535 L750,535" marker-end="url(#arrow-roadmap)"/><g class="edge-label"><rect x="675.5" y="501" width="69" height="31" rx="3"/><text text-anchor="middle"><tspan x="710" y="515">Chưa đạt /</tspan><tspan x="710" y="528">lỗi</tspan></text></g></g><g class="edge retry"><path d="M890,580 L890,610 L705,610 L705,535 L670,535" marker-end="url(#arrow-roadmap)"/><g class="edge-label"><rect x="898" y="580" width="111.69999999999999" height="18" rx="3"/><text text-anchor="start"><tspan x="902" y="594">Củng cố / thử lại</tspan></text></g></g><g class="edge normal"><path d="M530,580 L530,640" marker-end="url(#arrow-roadmap)"/><g class="edge-label"><rect x="538" y="595" width="166.6" height="18" rx="3"/><text text-anchor="start"><tspan x="542" y="609">Đạt trong phạm vi kiểm tra</tspan></text></g></g><g class="edge retry"><path d="M390,685 L340,685 L340,385 L390,385" marker-end="url(#arrow-roadmap)"/><g class="edge-label"><rect x="336.6" y="664" width="56.8" height="18" rx="3"/><text text-anchor="middle"><tspan x="365" y="678">Mục tiếp</tspan></text></g></g><g class="node extension" data-node="open" tabindex="0" role="button" aria-label="Mở lộ trình: Đọc mục tiêu đang được xác nhận" aria-pressed="false"><rect class="box" x="390" y="40" width="280" height="90" rx="10"/><text class="node-kind" x="410" y="61">Thiết kế mở rộng</text><text class="node-title" x="410" y="87">Mở lộ trình</text><text class="node-caption" x="410" y="110">Đọc mục tiêu đang được xác nhận</text></g><g class="node decision" data-node="has" tabindex="0" role="button" aria-label="Có kết quả nền phù hợp?: Kiểm tra phạm vi và bằng chứng" aria-pressed="false"><path class="box" d="M408,190 H652 L670,235 L652,280 H408 L390,235 Z"/><text class="node-kind" x="410" y="211">Điều kiện / lựa chọn</text><text class="node-title" x="410" y="237">Có kết quả nền phù hợp?</text><text class="node-caption" x="410" y="260">Kiểm tra phạm vi và bằng chứng</text></g><g class="node destination" data-node="test" tabindex="0" role="button" aria-label="Làm kiểm tra đầu vào: Chuyển sang trang Kiểm tra đầu vào" aria-pressed="false"><rect class="box" x="750" y="190" width="280" height="90" rx="10"/><text class="node-kind" x="770" y="211">Chuyển trang</text><text class="node-title" x="770" y="237">Làm kiểm tra đầu vào</text><text class="node-caption" x="770" y="260">Chuyển sang trang Kiểm tra đầu vào</text></g><g class="node extension" data-node="choose" tabindex="0" role="button" aria-label="Chọn chặng và mục học: Lý do chọn · tiên quyết · thời lượng" aria-pressed="false"><rect class="box" x="390" y="340" width="280" height="90" rx="10"/><text class="node-kind" x="410" y="361">Thiết kế mở rộng</text><text class="node-title" x="410" y="387">Chọn chặng và mục học</text><text class="node-caption" x="410" y="410">Lý do chọn · tiên quyết · thời lượng</text></g><g class="node extension" data-node="learn" tabindex="0" role="button" aria-label="Học rồi kiểm tra mục: Trả lời tự luận ngắn, xem căn cứ" aria-pressed="false"><rect class="box" x="390" y="490" width="280" height="90" rx="10"/><text class="node-kind" x="410" y="511">Thiết kế mở rộng</text><text class="node-title" x="410" y="537">Học rồi kiểm tra mục</text><text class="node-caption" x="410" y="560">Trả lời tự luận ngắn, xem căn cứ</text></g><g class="node error" data-node="reinforce" tabindex="0" role="button" aria-label="Cần củng cố / chưa đủ căn cứ: Học lại · bổ sung · thử đánh giá lại" aria-pressed="false"><rect class="box" x="750" y="490" width="280" height="90" rx="10"/><text class="node-kind" x="770" y="511">Nhánh lỗi / ngoại lệ</text><text class="node-title" x="770" y="537">Cần củng cố / chưa đủ căn cứ</text><text class="node-caption" x="770" y="560">Học lại · bổ sung · thử đánh giá lại</text></g><g class="node result" data-node="update" tabindex="0" role="button" aria-label="Cập nhật lộ trình: Lưu kết quả và bước học tiếp" aria-pressed="false"><rect class="box" x="390" y="640" width="280" height="90" rx="10"/><text class="node-kind" x="410" y="661">Kết quả</text><text class="node-title" x="410" y="687">Cập nhật lộ trình</text><text class="node-caption" x="410" y="710">Lưu kết quả và bước học tiếp</text></g><g class="node extension" data-node="change" tabindex="0" role="button" aria-label="Đổi mục tiêu / kiểm tra lại: Xác nhận tạo phiên bản kế hoạch mới" aria-pressed="false"><rect class="box" x="30" y="340" width="280" height="90" rx="10"/><text class="node-kind" x="50" y="361">Thiết kế mở rộng</text><text class="node-title" x="50" y="387">Đổi mục tiêu / kiểm tra lại</text><text class="node-caption" x="50" y="410">Xác nhận tạo phiên bản kế hoạch mới</text></g></svg>