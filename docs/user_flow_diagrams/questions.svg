<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 770" role="group" aria-label="Sơ đồ Câu hỏi luyện tập" class="flow-svg"><title>User flow — Câu hỏi luyện tập</title><desc>Thư viện → Chi tiết → Xác nhận mục tiêu → Trả lời → Kết quả. Chọn một khối để xem chi tiết.</desc><defs><marker id="arrow-questions" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#69778d"/></marker></defs><style>.flow-svg{font-family:'Segoe UI',Arial,sans-serif}.edge path{fill:none;stroke:#69778d;stroke-width:1.7;stroke-linejoin:round}.edge.retry path{stroke-dasharray:5 4}.edge.optional path{stroke-dasharray:2 5}.edge-label rect{fill:#fff;opacity:.97}.edge-label text{font-size:11px;fill:#475569}.node{cursor:pointer;outline:none}.node .box{fill:#f5f3ff;stroke:#8b76bd;stroke-width:1.4}.node.extension .box{fill:#f8fafc;stroke:#9ca9ba;stroke-dasharray:5 3}.node.decision .box{fill:#fff8e7;stroke:#b58b30}.node.error .box{fill:#fff3ef;stroke:#c78570}.node.result .box{fill:#edf9f5;stroke:#478b77}.node.destination .box{fill:#eef4ff;stroke:#7792bd}.node-kind{font-size:10.5px;fill:#596579}.node-title{font-size:16px;font-weight:650;fill:#1e293b}.node-caption{font-size:12px;fill:#4d5b70}.node:hover .box{stroke:#594090;stroke-width:2.5}.node:focus .box,.node[aria-pressed=true] .box{stroke:#593699;stroke-width:3.5}.node[aria-pressed=true] .node-title{fill:#50317f}</style><rect width="1060" height="770" fill="white"/><g class="edge normal"><path d="M530,130 L530,190" marker-end="url(#arrow-questions)"/></g><g class="edge normal"><path d="M390,85 L310,85" marker-end="url(#arrow-questions)"/><g class="edge-label"><rect x="309.4" y="64" width="81.19999999999999" height="18" rx="3"/><text text-anchor="middle"><tspan x="350" y="78">Không có câu</tspan></text></g></g><g class="edge retry"><path d="M170,40 L170,20 L530,20 L530,40" marker-end="url(#arrow-questions)"/><g class="edge-label"><rect x="178" y="15" width="50.699999999999996" height="18" rx="3"/><text text-anchor="start"><tspan x="182" y="29">Thử lại</tspan></text></g></g><g class="edge normal"><path d="M530,280 L530,340" marker-end="url(#arrow-questions)"/><g class="edge-label"><rect x="538" y="295" width="87.3" height="18" rx="3"/><text text-anchor="start"><tspan x="542" y="309">Luyện câu này</tspan></text></g></g><g class="edge normal"><path d="M530,430 L530,490" marker-end="url(#arrow-questions)"/><g class="edge-label"><rect x="538" y="445" width="75.1" height="18" rx="3"/><text text-anchor="start"><tspan x="542" y="459">Đã xác nhận</tspan></text></g></g><g class="edge normal"><path d="M530,580 L530,640" marker-end="url(#arrow-questions)"/><g class="edge-label"><rect x="538" y="595" width="117.8" height="18" rx="3"/><text text-anchor="start"><tspan x="542" y="609">Đã lưu và đánh giá</tspan></text></g></g><g class="edge normal"><path d="M670,535 L750,535" marker-end="url(#arrow-questions)"/><g class="edge-label"><rect x="687.7" y="514" width="44.599999999999994" height="18" rx="3"/><text text-anchor="middle"><tspan x="710" y="528">Có lỗi</tspan></text></g></g><g class="edge retry"><path d="M890,490 L890,465 L670,465 L670,490" marker-end="url(#arrow-questions)"/><g class="edge-label"><rect x="898" y="462.5" width="50.699999999999996" height="18" rx="3"/><text text-anchor="start"><tspan x="902" y="476.5">Thử lại</tspan></text></g></g><g class="edge normal"><path d="M670,685 L750,685" marker-end="url(#arrow-questions)"/><g class="edge-label"><rect x="669.4" y="664" width="81.19999999999999" height="18" rx="3"/><text text-anchor="middle"><tspan x="710" y="678">Xem chi tiết</tspan></text></g></g><g class="edge normal"><path d="M390,685 L310,685" marker-end="url(#arrow-questions)"/><g class="edge-label"><rect x="315.5" y="664" width="69" height="18" rx="3"/><text text-anchor="middle"><tspan x="350" y="678">Luyện thêm</tspan></text></g></g><g class="edge retry"><path d="M30,685 L10,685 L10,385 L390,385" marker-end="url(#arrow-questions)"/><g class="edge-label"><rect x="-8.399999999999999" y="664" width="56.8" height="18" rx="3"/><text text-anchor="middle"><tspan x="20" y="678">Lượt mới</tspan></text></g></g><g class="edge normal"><path d="M670,535 L710,535 L710,385 L750,385" marker-end="url(#arrow-questions)"/><g class="edge-label"><rect x="652.45" y="514" width="75.1" height="18" rx="3"/><text text-anchor="middle"><tspan x="690" y="528">Chọn ghi âm</tspan></text></g></g><g class="edge retry"><path d="M890,430 L890,450 L690,450 L690,490 L670,490" marker-end="url(#arrow-questions)"/><g class="edge-label"><rect x="898" y="425" width="99.5" height="18" rx="3"/><text text-anchor="start"><tspan x="902" y="439">Dùng transcript</tspan></text></g></g><g class="edge normal"><path d="M390,535 L310,535" marker-end="url(#arrow-questions)"/><g class="edge-label"><rect x="321.6" y="514" width="56.8" height="18" rx="3"/><text text-anchor="middle"><tspan x="350" y="528">Gửi chat</tspan></text></g></g><g class="node step" data-node="list" tabindex="0" role="button" aria-label="Mở thư viện câu hỏi: Tìm kiếm · lọc chủ đề/cấp độ" aria-pressed="false"><rect class="box" x="390" y="40" width="280" height="90" rx="10"/><text class="node-kind" x="410" y="61">Bước thực hiện</text><text class="node-title" x="410" y="87">Mở thư viện câu hỏi</text><text class="node-caption" x="410" y="110">Tìm kiếm · lọc chủ đề/cấp độ</text></g><g class="node error" data-node="empty" tabindex="0" role="button" aria-label="Không tìm thấy câu: Xóa bộ lọc hoặc tải lại" aria-pressed="false"><rect class="box" x="30" y="40" width="280" height="90" rx="10"/><text class="node-kind" x="50" y="61">Nhánh lỗi / ngoại lệ</text><text class="node-title" x="50" y="87">Không tìm thấy câu</text><text class="node-caption" x="50" y="110">Xóa bộ lọc hoặc tải lại</text></g><g class="node step" data-node="detail" tabindex="0" role="button" aria-label="Xem chi tiết câu: Đề · mục tiêu · tiêu chí · nguồn" aria-pressed="false"><rect class="box" x="390" y="190" width="280" height="90" rx="10"/><text class="node-kind" x="410" y="211">Bước thực hiện</text><text class="node-title" x="410" y="237">Xem chi tiết câu</text><text class="node-caption" x="410" y="260">Đề · mục tiêu · tiêu chí · nguồn</text></g><g class="node step" data-node="setup" tabindex="0" role="button" aria-label="Xác nhận mục tiêu: Vai trò · cấp độ · chủ đề" aria-pressed="false"><rect class="box" x="390" y="340" width="280" height="90" rx="10"/><text class="node-kind" x="410" y="361">Bước thực hiện</text><text class="node-title" x="410" y="387">Xác nhận mục tiêu</text><text class="node-caption" x="410" y="410">Vai trò · cấp độ · chủ đề</text></g><g class="node step" data-node="write" tabindex="0" role="button" aria-label="Soạn và nộp câu trả lời: Văn bản / STT đã xác nhận" aria-pressed="false"><rect class="box" x="390" y="490" width="280" height="90" rx="10"/><text class="node-kind" x="410" y="511">Bước thực hiện</text><text class="node-title" x="410" y="537">Soạn và nộp câu trả lời</text><text class="node-caption" x="410" y="560">Văn bản / STT đã xác nhận</text></g><g class="node error" data-node="failure" tabindex="0" role="button" aria-label="Lưu / đánh giá gặp lỗi: Giữ bài · thử lại đúng bước" aria-pressed="false"><rect class="box" x="750" y="490" width="280" height="90" rx="10"/><text class="node-kind" x="770" y="511">Nhánh lỗi / ngoại lệ</text><text class="node-title" x="770" y="537">Lưu / đánh giá gặp lỗi</text><text class="node-caption" x="770" y="560">Giữ bài · thử lại đúng bước</text></g><g class="node result" data-node="result" tabindex="0" role="button" aria-label="Đọc kết quả câu: Điểm có căn cứ · phần cần cải thiện" aria-pressed="false"><rect class="box" x="390" y="640" width="280" height="90" rx="10"/><text class="node-kind" x="410" y="661">Kết quả</text><text class="node-title" x="410" y="687">Đọc kết quả câu</text><text class="node-caption" x="410" y="710">Điểm có căn cứ · phần cần cải thiện</text></g><g class="node result" data-node="evidence" tabindex="0" role="button" aria-label="Xem căn cứ: Mở đúng đoạn trong bài gốc" aria-pressed="false"><rect class="box" x="750" y="640" width="280" height="90" rx="10"/><text class="node-kind" x="770" y="661">Kết quả</text><text class="node-title" x="770" y="687">Xem căn cứ</text><text class="node-caption" x="770" y="710">Mở đúng đoạn trong bài gốc</text></g><g class="node extension" data-node="again" tabindex="0" role="button" aria-label="Luyện câu liên quan: Cùng kỹ năng · khác ngữ cảnh" aria-pressed="false"><rect class="box" x="30" y="640" width="280" height="90" rx="10"/><text class="node-kind" x="50" y="661">Thiết kế mở rộng</text><text class="node-title" x="50" y="687">Luyện câu liên quan</text><text class="node-caption" x="50" y="710">Cùng kỹ năng · khác ngữ cảnh</text></g><g class="node step" data-node="voice" tabindex="0" role="button" aria-label="Ghi âm → xác nhận transcript: Bắt đầu · Dừng · Sửa · Dùng" aria-pressed="false"><rect class="box" x="750" y="340" width="280" height="90" rx="10"/><text class="node-kind" x="770" y="361">Bước thực hiện</text><text class="node-title" x="770" y="387">Ghi âm → xác nhận transcript</text><text class="node-caption" x="770" y="410">Bắt đầu · Dừng · Sửa · Dùng</text></g><g class="node step" data-node="chat" tabindex="0" role="button" aria-label="Chat trợ lý riêng: Hỏi rõ · xin gợi ý có giới hạn" aria-pressed="false"><rect class="box" x="30" y="490" width="280" height="90" rx="10"/><text class="node-kind" x="50" y="511">Bước thực hiện</text><text class="node-title" x="50" y="537">Chat trợ lý riêng</text><text class="node-caption" x="50" y="560">Hỏi rõ · xin gợi ý có giới hạn</text></g></svg>