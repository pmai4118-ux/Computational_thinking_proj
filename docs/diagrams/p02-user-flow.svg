<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc">
<title id="title">P02 — Luồng demo phỏng vấn Fresher Backend Java</title>
<desc id="desc">Xác nhận cấu hình, trả lời một câu, lưu trước khi đánh giá, hiển thị điểm và chuyển câu không theo điểm. Lỗi lưu giữ draft; lỗi đánh giá thử lại bài đã lưu. Hết câu đến tổng kết.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#625A73"/></marker>
<style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#211A32} .head{font-size:28px;font-weight:700}.sub{font-size:16px;fill:#625A73}.label{font-size:18px;font-weight:600}.body{font-size:15px}.edge{fill:none;stroke:#625A73;stroke-width:2;marker-end:url(#arrow)}.box{fill:white;stroke:#C4B5FD;stroke-width:2}.err{fill:#FFF7ED;stroke:#C97836;stroke-width:1.5}.tag{font-size:14px;fill:#625A73}</style></defs>
<rect width="1200" height="1080" fill="#F5F3FA"/>
<text x="48" y="53" class="head">P02 · Phiên phỏng vấn để demo đối chứng rubric</text>
<text x="48" y="84" class="sub">Qthynhh · 09/11/2026 · Luồng thiết kế, chưa phải chức năng đã triển khai</text>
<path class="edge" d="M350 180 V212"/><path class="edge" d="M350 300 V335"/>
<path class="edge" d="M350 420 V465"/><path class="edge" d="M350 535 V575"/>
<path class="edge" d="M350 645 V690"/><path class="edge" d="M350 780 V835"/>
<path class="edge" d="M350 915 V955"/>
<path class="edge" d="M605 255 H715"/><path class="edge" d="M850 300 V325 H665 V255 H605"/>
<path class="edge" d="M605 500 H715"/><path class="edge" d="M850 545 V565 H665 V510 H605"/>
<path class="edge" d="M605 610 H715"/><path class="edge" d="M850 660 V675 H665 V620 H605"/>
<path class="edge" d="M95 875 H50 V378 H95"/>
<rect x="95" y="110" width="510" height="70" rx="14" class="box"/>
<text x="120" y="140" class="label">S01 · Bắt đầu / Tiếp tục phiên</text>
<text x="120" y="164" class="body">Phiên còn truy cập được → mở đúng bước đã lưu</text>
<rect x="95" y="212" width="510" height="88" rx="14" class="box"/>
<text x="120" y="244" class="label">S02 · Thiết lập và xác nhận</text>
<text x="120" y="270" class="body">Backend Java · Fresher · chủ đề · loại câu</text>
<rect x="95" y="335" width="510" height="85" rx="14" class="box"/>
<text x="120" y="367" class="label">S03 · Đọc đề và nhập câu trả lời</text>
<text x="120" y="393" class="body">Giữ bản nháp; người dùng chủ động bấm Gửi</text>
<text x="366" y="450" class="tag">Gửi câu trả lời</text>
<rect x="95" y="465" width="510" height="70" rx="14" class="box"/>
<text x="120" y="494" class="label">Lưu nguyên văn bài làm</text>
<text x="120" y="519" class="body">Cùng submission ID → cùng bài đã lưu</text>
<rect x="95" y="575" width="510" height="70" rx="14" class="box"/>
<text x="120" y="604" class="label">Đánh giá bài đã lưu theo rubric</text>
<text x="120" y="629" class="body">Bộ đánh giá của MelBel; UI không tự tính điểm</text>
<rect x="95" y="690" width="510" height="90" rx="14" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
<text x="120" y="723" class="label">S04 · Điểm từng tiêu chí và tổng</text>
<text x="120" y="749" class="body">Hiện ngay sau mỗi câu; null khác điểm 0</text>
<text x="120" y="771" class="tag">Kết thúc phiên → S05; còn câu → bấm Câu tiếp theo</text>
<rect x="95" y="835" width="510" height="80" rx="14" class="box"/>
<text x="120" y="866" class="label">Còn câu chưa hỏi trong phiên?</text>
<text x="120" y="892" class="body">Có → quay về S03 · Không → S05</text>
<text x="63" y="697" class="tag" transform="rotate(-90 63 697)">Câu tiếp theo không phụ thuộc điểm</text>
<rect x="95" y="955" width="510" height="78" rx="14" class="box"/>
<text x="120" y="986" class="label">S05 · Tổng kết các câu và điểm</text>
<text x="120" y="1012" class="body">Xem lại · Phiên mới → S02 · Về đầu → S01</text>
<rect x="715" y="212" width="420" height="88" rx="12" class="err"/>
<text x="739" y="244" class="label">Thiếu cấu hình / chưa có câu phù hợp</text>
<text x="739" y="271" class="body">Hỏi phần thiếu, đổi lựa chọn hoặc về đầu</text>
<rect x="715" y="465" width="420" height="80" rx="12" class="err"/>
<text x="739" y="495" class="label">Lưu lỗi / chưa rõ đã lưu chưa</text>
<text x="739" y="522" class="body">Giữ draft; gửi lại cùng ID, chưa gọi chấm</text>
<rect x="715" y="575" width="420" height="85" rx="12" class="err"/>
<text x="739" y="605" class="label">Provider lỗi / timeout</text>
<text x="739" y="632" class="body">Thử lại cùng answer ID; không mất bài</text>
<rect x="715" y="735" width="420" height="145" rx="12" class="box"/>
<text x="739" y="769" class="label">Phục hồi chung</text>
<text x="739" y="799" class="body">Hết quyền: giữ draft, khôi phục quyền hợp lệ</text>
<text x="739" y="824" class="body">hoặc về thiết lập; không ghi vào phiên cũ.</text>
<text x="739" y="850" class="body">Thoát sớm: xác nhận, tổng kết chưa hoàn tất.</text>
<rect x="715" y="915" width="420" height="118" rx="12" fill="#CCFBF1"/>
<text x="739" y="948" class="label">Giới hạn demo</text>
<text x="739" y="976" class="body">Chưa nhận xét điểm mạnh / điểm yếu.</text>
<text x="739" y="1002" class="body">Chưa đề xuất bài tập hoặc lộ trình.</text>
</svg>
