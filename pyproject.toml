[build-system]
requires = ["setuptools==79.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "computational-thinking-proj"
version = "0.1.0"
description = "Vietnamese technical interview practice application"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "pydantic>=2,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "pytest>=8.4,<9",
]

[tool.setuptools.packages.find]
include = ["source", "source.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = ["--import-mode=importlib"]
python_files = ["test_*.py", "*Test.py"]
python_functions = ["test_*", "test[A-Z]*"]
